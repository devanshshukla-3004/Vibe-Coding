name: Study Planner tests

on:
  push:
    paths:
      - "projects/study-planner/**"
      - ".github/workflows/study-planner-tests.yml"
  pull_request:
    paths:
      - "projects/study-planner/**"
      - ".github/workflows/study-planner-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/study-planner
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
